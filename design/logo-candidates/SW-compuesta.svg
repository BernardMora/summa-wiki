<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" role="img" aria-label="Summa">
  <!--
    Compuesto, no generado: las letras Didone salen de SB1 y el libro de SB3
    —de cada uno lo que funcionaba— recolocados sobre sus bounding boxes reales
    en vez de re-promptear, que no habría dado exactamente estas dos piezas.

    Dos correcciones sobre el material original de Recraft, ambas obligatorias
    y documentadas en design/logo-candidates/README.md:

    1. EL AZUL. Recraft ignora `background_color`: devolvió rgb(14,69,240) en
       SB1 y rgb(5,87,251) en SB3, dos azules distintos y ninguno el de la app.
       Aquí se fija #2f5fbf a mano, incluidas las contraformas de las letras,
       que deben ser exactamente el color del fondo para leerse como huecos.

    2. LAS ESQUINAS. El original fingía el redondeado pintando las cuatro
       esquinas de BLANCO OPACO, lo que deja cuadros blancos en el Dock y sobre
       cualquier fondo que no sea blanco. Esos cuatro trazos se descartan y el
       redondeo se hace de verdad con un clipPath, así queda transparente.
  -->
  <defs>
    <clipPath id="corner">
      <rect width="2048" height="2048" rx="356" ry="356"/>
    </clipPath>
  </defs>
