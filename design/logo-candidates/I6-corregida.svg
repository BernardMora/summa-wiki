<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" role="img" aria-label="Wiki">
  <!--
    I6 corregida. Tres arreglos sobre lo que devolvió Recraft, ninguno estético:

    1. El fondo era un CUADRADO (`M 0 0 L … z`, sin una sola curva) y las
       esquinas redondeadas estaban falsificadas con cuatro cuñas BLANCAS
       pintadas encima. Sobre cualquier fondo que no fuera blanco — el Dock, la
       barra lateral en modo oscuro — habrían aparecido cuatro triángulos
       blancos. Ahora es un <rect rx> de verdad y las esquinas son
       transparentes.

    2. `preserveAspectRatio="none"` deformaba la letra en cualquier contenedor
       que no fuera exactamente cuadrado. Quitado: el valor por defecto
       (xMidYMid meet) conserva la proporción.

    3. `width`/`height` fijos en 1024 impedían que escalara con su contenedor.
       Fuera; que mande el CSS.

    El radio (460 de 2048 ≈ 22%) se dedujo de dónde arrancaban los tramos
    rectos del cuadrado original, para conservar la silueta que se aprobó.

    La letra y el libro son los paths originales, intactos.
  -->
