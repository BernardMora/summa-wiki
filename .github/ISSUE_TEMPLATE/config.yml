# Los issues en blanco quedan permitidos a propósito: hay reportes que no son
# ni un bug ni una petición —una pregunta, una nota sobre la documentación— y
# obligarlos a entrar por un formulario que no les queda hace que no se envíen.
blank_issues_enabled: true
