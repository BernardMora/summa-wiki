# Publicar una versión para las tres plataformas.
#
# Por qué existe: node-pty es un módulo nativo y Electron trae su propio Node,
# así que un paquete de Windows hecho desde un Mac es un paquete que nadie
# probó en Windows. Compilar cada plataforma EN esa plataforma no es una
# preferencia de estilo: es la única forma de que el binario que se descarga
# alguien sea el mismo que pasó las pruebas.
#
# Sustituye a `package:linux:docker`, que existía porque no había otra manera
# de tocar Linux desde un portátil de Apple, y que nunca pudo producir el
# paquete de mac x64 — los Intel siguen siendo la mitad de los Macs en uso.
#
# El disparador es el tag. Empujar `v0.3.0` construye, prueba y publica; no
# hay ningún paso manual entre el tag y el Release, que es justamente lo que
# evita la versión "la subí desde mi máquina y no me acuerdo con qué".

name: Release

on:
  push:
    tags: ['v*']
  # Para ensayar el pipeline entero sin crear una versión: construye y prueba,
  # pero no publica nada (ver el `if` del paso de electron-builder).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Sin esto, el primer fallo cancela las otras tres y te quedas sin saber
      # si el problema era de una plataforma o de todas. Enterarse de los
      # cuatro resultados a la vez ahorra una vuelta entera de CI.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            args: --mac --arm64
          # Un runner Intel de verdad, no una compilación cruzada. Universal
          # queda descartado a propósito: duplicaría el peso del .dmg para dar
          # a cada usuario una arquitectura que no usa.
          - name: macOS (Intel)
            os: macos-13
            args: --mac --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder invoca estas herramientas para armar el .deb y el
      # AppImage. No vienen todas en el runner y el fallo que dan cuando faltan
      # ocurre al final de la build, después de diez minutos de trabajo.
      - name: Dependencias de empaquetado de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg squashfs-tools

      - run: npm ci

      # El tag manda sobre package.json, no al revés: electron-builder sube los
      # artefactos al Release del tag `v${version}`, así que un tag v0.3.0 con
      # un package.json en 0.2.0 publica en un Release que nadie pidió. Vale
      # más romper aquí, en cinco segundos, que a mitad de la matriz.
      - name: El tag coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::El tag es v$tag y package.json dice $pkg."
            exit 1
          fi

      # `src/config.ts` resuelve el vault al IMPORTARSE, y cuando no hay
      # ninguno cae al directorio de datos del usuario. Durante `next build`
      # eso hace que la compilación mire dentro del perfil de quien compila:
      # en Windows, `C:\Users\<user>\AppData\Roaming\…`, cuyo padre
      # contiene el junction heredado `Application Data` que devuelve EPERM y
      # tumba el build con un error de webpack que no menciona ningún vault.
      # En macOS y Linux el equivalente existe y se lee, así que el fallo solo
      # se veía en una de las tres plataformas.
      #
      # Un directorio vacío dentro del workspace quita la dependencia del
      # home. El arreglo de fondo es que config.ts no resuelva nada al
      # importarse — ver docs/future-work.md.
      - name: Vault vacío para que el build no mire el home
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-vault"
          echo "WIKI_VAULT=$GITHUB_WORKSPACE/.ci-vault" >> "$GITHUB_ENV"

      - run: npm run build

      # Un secreto que no existe NO deja la variable sin definir: la deja
      # definida y VACÍA. electron-builder distingue mal los dos casos —
      # con CSC_LINK="" intenta firmar igual, resuelve la ruta vacía contra
      # el directorio del proyecto y muere con `<workspace> not a file`,
      # después de haber empaquetado todo. Por eso las variables de firma se
      # exportan aquí y solo si traen algo, en vez de declararlas en el `env`
      # del paso, que es lo que las volvía vacías-pero-presentes.
      #
      # Al dar de alta la cuenta de Apple Developer basta con crear los
      # secretos; este archivo no se toca.
      #
      #   CSC_LINK           el .p12 del certificado, en base64
      #   CSC_KEY_PASSWORD   su contraseña
      #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarizado
      #
      # Sin ellos el .dmg sale sin firmar y macOS dice "la app está dañada".
      # Es el estado de hoy, y es deliberado: mejor sin firmar que sin build.
      - name: Firma de macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "::notice::Certificado presente: se firmará el paquete."
            for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
            done
          else
            # La forma documentada de decirle a electron-builder que NO busque
            # identidades en el llavero. Sin esto encuentra las que haya en el
            # runner y falla a medias.
            echo "::warning::Sin certificado de Apple: el paquete sale sin firmar."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Empaquetar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--publish always` sube al Release en borrador declarado en
        # electron-builder.yml; el primer job de la matriz lo crea y los otros
        # tres lo reutilizan. En borrador para que nadie descargue un .dmg
        # mientras el .exe todavía se está compilando.
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      # Después de empaquetar y en cada plataforma, porque el fallo que busca
      # solo existe en el paquete: otro cwd, otro node, otro conjunto de
      # archivos. Es lo que sostiene las exclusiones de electron-builder.yml —
      # quitar 400 MB del paquete es seguro solo si algo comprueba que el
      # servidor sigue arrancando en las tres.
      - name: Prueba de humo del paquete
        run: npm run smoke

      # Solo cuando no hay tag: si no se publicó, esta es la única forma de
      # bajarse lo que se construyó y probarlo a mano.
      - name: Guardar los artefactos
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    name: Publicar el Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # `needs: build` es la puerta: este job no corre si alguna de las cuatro
      # plataformas falló al construir O al pasar la prueba de humo. El
      # borrador se queda ahí, con sus artefactos, para poder mirar qué pasó,
      # pero nadie lo ve en la página de releases.
      #
      # Quitar el borrador es lo último que ocurre, y es lo que hace que
      # "empujar un tag" sea una decisión y no un riesgo.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
