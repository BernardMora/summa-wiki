# Packaging configuration.
#
# This lives outside package.json because electron-builder validates its schema
# against a closed list of keys and rejects the `"//": "comment"` trick used
# everywhere else in this project. The alternative was leaving 346 MB of
# exclusions unexplained, and an exclusion with no written reason is one
# somebody reverts in six months "just in case". Same reasoning as
# next.config.mjs: the format is chosen so the decision can be documented.

appId: com.summawiki.app
productName: Summa Wiki

# false on purpose, not by oversight. Next writes to disk at runtime, and
# inside a .asar the filesystem is read-only. Packaging with asar first
# requires moving those writes to userData; until then this stays as it is.
asar: false

directories:
  output: dist

files:
  - .next-build/**/*
  - electron/**/*
  - src/**/*
  - lib/**/*
  - public/**/*
  - server.ts
  - next.config.mjs
  - package.json
  - node_modules/**/*

  # These five exclusions are worth 346 MB of the 579 that Resources weighed.
  # None of them is a fine-grained optimisation: all five are things needed
  # only at BUILD time, or for a code path this app does not take, that the
  # node_modules glob drags in.
  #
  #   cache/          182 MB. Next's incremental cache. It regenerates itself.
  #   @next/swc-*     124 MB. The compiler. The production server serves the
  #                   build, it does not compile — the same reason Next's own
  #                   `output: standalone` leaves it out, and the reason
  #                   next.config has to be .mjs and not .ts.
  #   pdfjs-dist       40 MB. Not one line of code imports it: the viewer is
  #                   served vendored from public/.
  #   @napi-rs         25 MB. The optional dependency pdfjs renders with in
  #                   Node. Here it renders in the browser.
  #   @img/sharp-*     15 MB. Next's optional native image optimiser, pulled in
  #                   for `next/image`. This app has no `next/image` import and
  #                   no `images` config; images are served as bytes by
  #                   `app/api/asset/route.ts` through plain `fs`, so the
  #                   optimiser is never reached. Verified by deleting it from
  #                   node_modules and booting the production build: every page
  #                   200s and a 1.5 MB WebP still serves. It is the same case
  #                   as @napi-rs one line up — an optional native dependency
  #                   for a path we don't take — and dropping it leaves the
  #                   package with no native modules at all, which is what the
  #                   macOS notarization item in ROADMAP.md wants.
  #
  # BEFORE CHANGING THIS LIST: an over-aggressive cut breaks the packaged app's
  # startup, never the code, so it cannot be seen without packaging. Run
  # `npm run smoke`, which boots the packaged server and fails if a path does
  # not resolve.
  #
  # Whether you need all three platforms depends on what you cut:
  #   - A package whose NAME varies per platform (@next/swc-*, @napi-rs,
  #     @img/sharp-*) needs all three, because a glob that matches on one may
  #     miss on another and the failure is silent until that platform runs.
  #   - Anything else needs one, and the CI release workflow smoke-tests all
  #     three before publishing anyway.
  # The @img cut below was verified on macOS; the glob is a prefix that matches
  # every platform's subpackage, so the remaining risk is a runtime require we
  # did not find, not a glob that failed to match.
  - '!.next-build/cache/**'
  - '!node_modules/@next/swc-*/**'
  - '!node_modules/pdfjs-dist/**'
  - '!node_modules/@napi-rs/**'
  - '!node_modules/@img/**'
  - '!node_modules/sharp/**'

  # 77 MB of source maps. They only make a stack trace point at a dependency's
  # original TypeScript, and nobody debugs node_modules from an installed app.
  # Excluded here and not in .next-build: the build's own maps are wanted by
  # whoever reports a client-side bug.
  - '!node_modules/**/*.map'

# Draft: the Release is published only once all four platforms have finished. A
# release that shows up with the .dmg and without the .exe is worse than one
# that takes five more minutes.
publish:
  - provider: github
    releaseType: draft

# Windows deliberately declares NO icon: `build/icon.ico` is the
# highest-priority candidate electron-builder looks for by convention, and that
# .ico is assembled by hand from the repository's PNGs and verified pixel by
# pixel. Declaring `icon: build/icon.png` here would override it with a
# conversion of the 512 PNG — worse art, and silently so.
win:
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# mac and linux do have to be named, because their files do not land where the
# convention looks: the .icns is called "Summa Wiki.icns" and not `icon.icns`,
# and linux needs the directory of PNGs by size. Without declaring them
# electron-builder does not fail — it warns "application icon is not set" and
# packages with Electron's atom, which is how the .app shipped until now.
mac:
  icon: build/Summa Wiki.icns
  target:
    - dmg
    - zip

linux:
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Office
