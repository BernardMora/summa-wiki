<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Berni's Wiki">
  <!--
    Nodo central con cuatro satélites: es el mapa de identidad del vault
    (¿Quién es Bernardo? en el centro, las preguntas alrededor) y además el
    grafo de enlaces, que es de lo que trata la app. Se eligió sobre una "B"
    porque a 16 px una letra serif se vuelve una mancha, y la forma de
    concentrador se sigue leyendo.
  -->
  <rect width="32" height="32" rx="7" fill="#2f5fbf"/>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <line x1="16" y1="16" x2="8"  y2="8"/>
    <line x1="16" y1="16" x2="24" y2="9"/>
    <line x1="16" y1="16" x2="7"  y2="23"/>
    <line x1="16" y1="16" x2="24" y2="24"/>
  </g>
  <g fill="#ffffff">
    <circle cx="8"  cy="8"  r="2.6" opacity="0.92"/>
    <circle cx="24" cy="9"  r="2.2" opacity="0.92"/>
    <circle cx="7"  cy="23" r="2.2" opacity="0.92"/>
    <circle cx="24" cy="24" r="2.6" opacity="0.92"/>
    <circle cx="16" cy="16" r="5"/>
  </g>
  <circle cx="16" cy="16" r="5" fill="none" stroke="#2f5fbf" stroke-width="1.2"/>
</svg>
